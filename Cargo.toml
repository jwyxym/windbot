[package]
name = "windbot-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
links = "windbot_native"
build = "rust/windbot/build.rs"
description = "Rust bindings with bundled WindBot C# sources and NativeAOT static compilation"
license = "MIT"
repository = "https://github.com/jwyxym/windbot"
readme = "README.md"
publish = false
include = [
	"/Cargo.toml",
	"/Cargo.lock",
	"/rust/windbot/build.rs",
	"/rust/windbot/src/**",
	"/rust/windbot/examples/**",
	"/WindBot.csproj",
	"/*.cs",
	"/App.config",
	"/Properties/**",
	"/Game/**",
	"/YGOSharp.Network/**",
	"/YGOSharp.OCGWrapper/**",
	"/YGOSharp.OCGWrapper.Enums/**",
	"/Decks/*.ydk",
	"/Dialogs/*.json",
	"/LICENSE",
	"/README.md",
]

[lib]
path = "rust/windbot/src/lib.rs"

[[bin]]
name = "winbot"
path = "rust/windbot/src/main.rs"
required-features = ["cli"]

[[example]]
name = "list"
path = "rust/windbot/examples/list.rs"

[dependencies]
serde_json = "1.0"
ygopro_cdb_reader = "0.1.6"
tokio = { version = "1", features = ["full"], optional = true }

[features]
default = ["link-native"]
link-native = []
cli = ["dep:tokio"]
