name: build

on:
  workflow_dispatch:
  push:
    branches: [windbot-rs]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, rid: win-x64, rust-target: x86_64-pc-windows-msvc }
          - { os: windows-2022, rid: win-arm64, rust-target: aarch64-pc-windows-msvc }
          - { os: ubuntu-22.04, rid: linux-x64, rust-target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, rust-target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, rid: osx-x64, rust-target: x86_64-apple-darwin }
          - { os: macos-latest, rid: osx-arm64, rust-target: aarch64-apple-darwin }
          - { os: macos-latest, rid: ios-arm64, rust-target: aarch64-apple-ios }
          - { os: macos-latest, rid: iossimulator-arm64, rust-target: aarch64-apple-ios-sim }
          - { os: macos-latest, rid: iossimulator-x64, rust-target: x86_64-apple-ios }
          - { os: ubuntu-22.04, rid: linux-bionic-arm, rust-target: armv7-linux-androideabi }
          - { os: ubuntu-22.04, rid: linux-bionic-arm64, rust-target: aarch64-linux-android }
          - { os: ubuntu-22.04, rid: linux-bionic-x64, rust-target: x86_64-linux-android }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Linux toolchain
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Select Android NDK toolchain
        if: startsWith(matrix.rid, 'linux-bionic-')
        shell: bash
        run: |
          android_toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          test -x "$android_toolchain/bin/clang"
          test -x "$android_toolchain/bin/llvm-ar"
          echo "$android_toolchain/bin" >> "$GITHUB_PATH"
          case '${{ matrix.rid }}' in
            linux-bionic-arm) android_clang=armv7a-linux-androideabi21-clang ;;
            linux-bionic-arm64) android_clang=aarch64-linux-android21-clang ;;
            linux-bionic-x64) android_clang=x86_64-linux-android21-clang ;;
          esac
          rust_target='${{ matrix.rust-target }}'
          rust_target="${rust_target//-/_}"
          test -x "$android_toolchain/bin/$android_clang"
          test -x "$android_toolchain/bin/${android_clang}++"
          echo "CC_${rust_target}=$android_toolchain/bin/$android_clang" >> "$GITHUB_ENV"
          echo "CXX_${rust_target}=$android_toolchain/bin/${android_clang}++" >> "$GITHUB_ENV"
          echo "AR_${rust_target}=$android_toolchain/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${rust_target^^}_LINKER=$android_toolchain/bin/$android_clang" >> "$GITHUB_ENV"
      - name: Install Rust target
        run: rustup target add ${{ matrix.rust-target }}
      - name: Check Rust library and compile bundled C# sources
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/artifacts/cargo
          RUSTFLAGS: ${{ startsWith(matrix.rid, 'win-') && '-C target-feature=+crt-static' || '' }}
        run: cargo check --target ${{ matrix.rust-target }} --all-targets
      - name: Collect NativeAOT artifact from Cargo output
        shell: bash
        run: |
          shopt -s nullglob
          native_dirs=(artifacts/cargo/${{ matrix.rust-target }}/debug/build/windbot-*/out/native-built)
          test "${#native_dirs[@]}" -eq 1
          mkdir -p artifacts/native/${{ matrix.rid }}
          cp -R "${native_dirs[0]}/." artifacts/native/${{ matrix.rid }}/
      - uses: actions/upload-artifact@v6
        with:
          name: windbot-${{ matrix.rid }}-static
          path: artifacts/native/${{ matrix.rid }}/
          if-no-files-found: error
      - name: Build platform executable
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/artifacts/cargo
          WINDBOT_NATIVE_DIR: ${{ github.workspace }}/artifacts/native/${{ matrix.rid }}
          RUSTFLAGS: ${{ startsWith(matrix.rid, 'win-') && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --target ${{ matrix.rust-target }} --bin winbot --features cli
      - name: Package platform executable
        shell: bash
        run: |
          executable=winbot
          output_name=windbot
          if [[ '${{ matrix.rid }}' == win-* ]]; then
            executable=winbot.exe
            output_name=windbot.exe
          fi
          source="artifacts/cargo/${{ matrix.rust-target }}/release/$executable"
          test -f "$source"
          mkdir -p artifacts/executable artifacts/packages
          cp "$source" "artifacts/executable/$output_name"
          chmod +x "artifacts/executable/$output_name"
          tar -czf "artifacts/packages/windbot-${{ matrix.rid }}.tar.gz" -C artifacts/executable "$output_name"
      - name: Upload platform executable
        uses: actions/upload-artifact@v6
        with:
          name: windbot-${{ matrix.rid }}
          path: artifacts/packages/windbot-${{ matrix.rid }}.tar.gz
          if-no-files-found: error

  release:
    needs: publish
    if: github.ref == 'refs/heads/windbot-rs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: windbot-release-latest
      cancel-in-progress: false
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: windbot-*
          path: downloaded
      - name: Prepare release assets
        shell: bash
        run: |
          shopt -s nullglob
          static_dirs=(downloaded/windbot-*-static)
          executables=(downloaded/windbot-*/*.tar.gz)
          test "${#static_dirs[@]}" -eq 12
          test "${#executables[@]}" -eq 12
          mkdir -p release-assets
          cp "${executables[@]}" release-assets/
          for directory in "${static_dirs[@]}"; do
            name="${directory##*/}"
            (
              cd "$directory"
              zip -q -r "$GITHUB_WORKSPACE/release-assets/$name.zip" .
            )
          done
      - name: Publish release-latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=release-latest
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
          fi
          printf 'Commit: %s\n\nBuild: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_RUN_ID" > release-notes.txt
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --title 'WindBot latest' \
              --notes-file release-notes.txt --draft=false --prerelease=false --latest
          else
            gh release create "$tag" --verify-tag --title 'WindBot latest' \
              --notes-file release-notes.txt --latest
          fi
          gh release upload "$tag" release-assets/* --clobber
