name: .NET build

on:
  workflow_dispatch:
  push:
    branches: [master, dotnet-native-static]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build WindBot.sln -c Debug
      - run: dotnet build WindBot.sln -c Release --no-restore
